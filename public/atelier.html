<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Atelier — Picturævox</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* SIDEBAR ARTISTE */
    .artist-sidebar {
      position: fixed;
      left: 10px;
      top: 10px;
      width: 190px;
      max-height: calc(100vh - 20px);
      overflow-y: auto;
      overflow-x: hidden;
      background: rgba(18, 18, 24, 0.92);
      border-radius: 14px;
      padding: 12px;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      scrollbar-width: thin;
      scrollbar-color: rgba(107,91,255,0.3) transparent;
    }
    .artist-sidebar::-webkit-scrollbar { width: 4px; }
    .artist-sidebar::-webkit-scrollbar-track { background: transparent; }
    .artist-sidebar::-webkit-scrollbar-thumb { background: rgba(107,91,255,0.3); border-radius: 2px; }

    .tool-section {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .tool-section:last-child { border-bottom: none; margin-bottom: 0; }

    .tool-section h4 {
      color: rgba(255,255,255,0.4);
      font-size: 10px;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .tool-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .artist-sidebar .tool-btn,
    .artist-sidebar .shape-btn {
      width: 36px;
      height: 36px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: #ccc;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .artist-sidebar .tool-btn:hover,
    .artist-sidebar .shape-btn:hover {
      background: rgba(255,255,255,0.12);
    }
    .artist-sidebar .tool-btn.active,
    .artist-sidebar .shape-btn.active {
      background: linear-gradient(135deg, #6b5bff, #8b7aff);
      color: #fff;
      box-shadow: 0 0 12px rgba(107, 91, 255, 0.4);
    }

    /* Couleurs */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }
    .color-grid .color-btn {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      box-sizing: border-box;
    }
    .color-grid .color-btn:hover { transform: scale(1.1); }
    .color-grid .color-btn.active {
      border-color: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
      transform: scale(1.1);
    }
    .color-grid .color-btn[data-color="#FFFFFF"] { border-color: rgba(255,255,255,0.2); }
    .color-grid .color-btn[data-color="#FFFFFF"].active { border-color: #FFD740; box-shadow: 0 0 6px rgba(255,215,64,0.5); }
    .color-grid .color-btn[data-color="#000000"] { border-color: rgba(255,255,255,0.15); }

    #color-picker {
      width: 100%;
      height: 28px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }

    /* Slider */
    .artist-sidebar #size-slider {
      width: 100%;
      height: 6px;
      background: linear-gradient(to right, rgba(107,91,255,0.3), rgba(107,91,255,0.8));
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      margin-bottom: 4px;
    }
    .artist-sidebar #size-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: #6b5bff; border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .artist-sidebar #size-slider::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: #6b5bff; border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    #size-display {
      color: #999;
      font-size: 11px;
      text-align: center;
      display: block;
      font-family: 'SF Mono', monospace;
    }

    /* Status bar - positionnée pour ne pas chevaucher */
    .status-bar {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      z-index: 999;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      background: rgba(18, 18, 24, 0.85);
      border-radius: 20px;
      font-size: 11px;
      color: #bbb;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }
    #latency-display { font-weight: 600; font-family: 'SF Mono', monospace; font-size: 11px; }

    /* Zoom indicator - sous le status bar */
    #zoom-indicator {
      position: fixed;
      top: 42px;
      right: 10px;
      background: rgba(18, 18, 24, 0.85);
      color: #bbb;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'SF Mono', monospace;
      z-index: 999;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .artist-sidebar { width: 160px; left: 5px; top: 5px; padding: 8px; }
      .artist-sidebar .tool-btn, .artist-sidebar .shape-btn { width: 32px; height: 32px; font-size: 13px; }
      .tool-section h4 { font-size: 9px; }
      #zoom-indicator { top: 36px; right: 5px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div id="connection-indicator" class="status-indicator">
      <span style="font-size: 14px;">●</span>
      <span>Connexion...</span>
    </div>
    <div class="status-indicator">
      <span style="font-size: 12px;">📡</span>
      <span id="latency-display">--ms</span>
    </div>
  </div>

  <div id="zoom-indicator">100%</div>

  <!-- SIDEBAR ARTISTE -->
  <div class="artist-sidebar">
    <div class="tool-section">
      <h4>Outils</h4>
      <div class="tool-grid">
        <button id="brush" class="tool-btn active" title="Pinceau">🖋️</button>
        <button id="texture" class="tool-btn" title="Spray">🖌️</button>
        <button id="sparkles" class="tool-btn" title="Paillettes">✨</button>
        <button id="watercolor" class="tool-btn" title="Aquarelle">💧</button>
        <button id="electric" class="tool-btn" title="Électrique">⚡</button>
        <button id="neon" class="tool-btn" title="Néon">🌟</button>
        <button id="fire" class="tool-btn" title="Feu">🔥</button>
        <button id="petals" class="tool-btn" title="Pétales">🌸</button>
        <button id="eraser" class="tool-btn" title="Gomme">🧽</button>
        <button id="pan" class="tool-btn" title="Déplacement">✋</button>
        <button id="eyedropper" class="tool-btn" title="Pipette">🎨</button>
      </div>
    </div>

    <div class="tool-section">
      <h4>Formes</h4>
      <div class="tool-grid">
        <button id="shape-circle" class="shape-btn" title="Cercle">⭕</button>
        <button id="shape-rectangle" class="shape-btn" title="Rectangle">▭</button>
        <button id="shape-triangle" class="shape-btn" title="Triangle">△</button>
        <button id="shape-star" class="shape-btn" title="Étoile">⭐</button>
        <button id="shape-line" class="shape-btn" title="Ligne">📏</button>
        <button id="shape-arrow" class="shape-btn" title="Flèche">➡️</button>
      </div>
    </div>

    <div class="tool-section">
      <h4>Couleurs</h4>
      <div class="color-grid">
        <div class="color-btn active" data-color="#FF5252" style="background:#FF5252;"></div>
        <div class="color-btn" data-color="#FFD740" style="background:#FFD740;"></div>
        <div class="color-btn" data-color="#40C4FF" style="background:#40C4FF;"></div>
        <div class="color-btn" data-color="#69F0AE" style="background:#69F0AE;"></div>
        <div class="color-btn" data-color="#E040FB" style="background:#E040FB;"></div>
        <div class="color-btn" data-color="#FF9800" style="background:#FF9800;"></div>
        <div class="color-btn" data-color="#795548" style="background:#795548;"></div>
        <div class="color-btn" data-color="#607D8B" style="background:#607D8B;"></div>
        <div class="color-btn" data-color="#000000" style="background:#000000;"></div>
        <div class="color-btn" data-color="#FFFFFF" style="background:#FFFFFF;"></div>
        <div class="color-btn" data-color="#F44336" style="background:#F44336;"></div>
        <div class="color-btn" data-color="#9C27B0" style="background:#9C27B0;"></div>
      </div>
      <input type="color" id="color-picker" value="#FF5252" />
    </div>

    <div class="tool-section">
      <h4>Épaisseur</h4>
      <input type="range" id="size-slider" min="1" max="50" value="4" />
      <span id="size-display">4px</span>
    </div>

    <div class="tool-section">
      <h4>Vue</h4>
      <div class="tool-grid">
        <button id="zoom-in" class="tool-btn" title="Zoom +">🔍+</button>
        <button id="zoom-out" class="tool-btn" title="Zoom -">🔍-</button>
        <button id="reset-zoom" class="tool-btn" title="Reset zoom">🎯</button>
      </div>
    </div>

    <div class="tool-section">
      <h4>Actions</h4>
      <div class="tool-grid">
        <button id="undo-btn" class="tool-btn" title="Annuler (Ctrl+Z)">↶</button>
        <button id="export" class="tool-btn" title="Exporter PNG">📷</button>
        <button id="back-home" class="tool-btn" title="Retour accueil">🏠</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/konva@9.2.0/konva.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="connectionManager.js"></script>
  <script src="brushManager.js"></script>
  <script src="atelier.js"></script>
</body>
</html>
