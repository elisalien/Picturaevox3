<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin — Picturævox</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ADMIN TOOLBAR */
    .admin-toolbar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 10px 16px;
      background: rgba(18, 18, 24, 0.92);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      z-index: 1000;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 217, 255, 0.15);
      transition: opacity 0.3s, transform 0.3s;
    }
    .admin-toolbar.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      pointer-events: none;
    }

    .admin-toolbar .tool-btn {
      width: 40px;
      height: 40px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: #ccc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .admin-toolbar .tool-btn:hover {
      background: rgba(0, 217, 255, 0.15);
      color: #fff;
    }
    .admin-toolbar .tool-btn.active {
      background: linear-gradient(135deg, #00b8d4, #00d9ff);
      color: #fff;
      box-shadow: 0 0 12px rgba(0, 217, 255, 0.4);
    }
    .admin-toolbar .tool-btn.danger:hover {
      background: rgba(244, 67, 54, 0.2);
    }

    .toolbar-divider {
      width: 1px;
      height: 28px;
      background: rgba(255,255,255,0.1);
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* ADMIN BADGE */
    .admin-badge {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 2000;
      padding: 6px 14px;
      background: rgba(0, 217, 255, 0.12);
      border: 1px solid rgba(0, 217, 255, 0.25);
      border-radius: 20px;
      color: #00d9ff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    /* HIDE UI */
    #hide-ui {
      position: fixed;
      top: 12px;
      right: 60px;
      z-index: 2000;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      background: rgba(18, 18, 24, 0.85);
      color: #bbb;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    #hide-ui:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* STATUS BAR */
    .status-bar {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 999;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      background: rgba(18, 18, 24, 0.85);
      border-radius: 20px;
      font-size: 11px;
      color: #bbb;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }
    #latency-display { font-weight: 600; font-family: 'SF Mono', monospace; font-size: 11px; }

    /* MINIMAP */
    #minimap {
      position: fixed;
      bottom: 80px;
      right: 12px;
      border: 1px solid rgba(0, 217, 255, 0.25);
      background: rgba(18, 18, 24, 0.85);
      z-index: 1000;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .admin-toolbar { padding: 8px 10px; gap: 4px; bottom: 10px; }
      .admin-toolbar .tool-btn { width: 36px; height: 36px; font-size: 15px; }
      #minimap { bottom: 70px; right: 6px; }
      .admin-badge { top: 6px; left: 6px; font-size: 10px; padding: 5px 10px; }
      #hide-ui { top: 6px; right: 50px; width: 32px; height: 32px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- ADMIN BADGE -->
  <div class="admin-badge">ADMIN</div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div id="connection-indicator" class="status-indicator">
      <span style="font-size: 14px;">●</span>
      <span>Connexion...</span>
    </div>
    <div class="status-indicator">
      <span style="font-size: 12px;">📡</span>
      <span id="latency-display">--ms</span>
    </div>
  </div>

  <!-- HIDE UI BUTTON -->
  <button id="hide-ui" title="Masquer/Afficher (H)">👁</button>

  <!-- TOOLBAR ADMIN -->
  <div class="admin-toolbar" id="admin-toolbar">
    <button id="pan" class="tool-btn active" title="Déplacement">✋</button>
    <button id="zoom-in" class="tool-btn" title="Zoom +">🔍+</button>
    <button id="zoom-out" class="tool-btn" title="Zoom -">🔍-</button>
    <button id="reset-zoom" class="tool-btn" title="Reset vue">🎯</button>
    <div class="toolbar-divider"></div>
    <button id="delete-mode" class="tool-btn" title="Supprimer un élément">🗑️</button>
    <button id="undo" class="tool-btn" title="Annuler">↶</button>
    <div class="toolbar-divider"></div>
    <button id="reset-effects" class="tool-btn danger" title="Reset effets">💥</button>
    <button id="clear-canvas" class="tool-btn danger" title="Effacer tout">🧹</button>
    <div class="toolbar-divider"></div>
    <button id="export" class="tool-btn" title="Exporter PNG">📷</button>
  </div>

  <!-- MINIMAP -->
  <canvas id="minimap" width="160" height="120"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/konva@9.2.0/konva.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="connectionManager.js"></script>
  <script src="brushManager.js"></script>
  <script src="admin.js"></script>
</body>
</html>
