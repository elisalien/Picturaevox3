<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cadavre Exquis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      overflow: auto;
      min-height: 100vh;
    }

    .waiting-state {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 15px;
    }

    .characters-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 0;
    }

    /* Round separator — thin line */
    .round-separator {
      width: 60px;
      height: 1px;
      background: #333;
      margin: 48px 0 40px;
    }
    .round-separator:first-child {
      margin-top: 0;
    }

    .round-row {
      display: flex;
      flex-wrap: wrap;
      gap: 60px;
      justify-content: center;
      width: 100%;
    }

    /* Character — no card, no frame, no shadow */
    .character-card {
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      max-width: 260px;
      width: 260px;
    }
    .character-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Body — raw stacked images */
    .character-body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .character-part {
      width: 100%;
      opacity: 0;
      transform-origin: center top;
    }
    .character-part img {
      width: 100%;
      display: block;
    }
    .character-part.revealed {
      animation: revealPart 0.5s ease-out forwards;
    }

    @keyframes revealPart {
      0% { opacity: 0; transform: scaleY(0.3); }
      60% { opacity: 1; transform: scaleY(1.02); }
      100% { opacity: 1; transform: scaleY(1); }
    }

    /* Rig animations */
    .character-body.animated .character-part.part-head {
      animation: rigHead 4s ease-in-out infinite;
    }
    .character-body.animated .character-part.part-torso {
      animation: rigTorso 5s ease-in-out infinite;
    }
    .character-body.animated .character-part.part-legs {
      animation: rigLegs 3.5s ease-in-out infinite;
    }

    @keyframes rigHead {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(2deg); }
      75% { transform: rotate(-2deg); }
    }
    @keyframes rigTorso {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(3px); }
    }
    @keyframes rigLegs {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(2px); }
    }

    /* Credits — plain text */
    .character-credits {
      margin-top: 14px;
      font-size: 11px;
      color: #555;
      line-height: 1.5;
    }

    .missing-part {
      width: 100%;
      height: 60px;
    }

    @media (max-width: 480px) {
      .characters-container { padding: 24px 12px; }
      .character-card { width: 200px; max-width: 200px; }
      .round-row { gap: 36px; }
      .round-separator { margin: 32px 0 28px; }
    }
  </style>
</head>
<body>
  <div class="waiting-state" id="waiting-state">en attente</div>
  <div class="characters-container" id="characters-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="exquiscadavre.js"></script>
</body>
</html>
