<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Picturævox — Dessin collaboratif</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* TOOLBAR PRINCIPALE */
    .toolbar-main {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(18, 18, 24, 0.92);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      z-index: 1000;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Ligne outils */
    .toolbar-row {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .toolbar-row::-webkit-scrollbar { display: none; }

    .toolbar-divider {
      width: 1px;
      height: 28px;
      background: rgba(255,255,255,0.1);
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* Ligne controles */
    .toolbar-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    /* Palette couleurs */
    .color-palette {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 4px 6px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 1;
    }
    .color-palette::-webkit-scrollbar { display: none; }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
      box-sizing: border-box;
    }
    .color-dot:hover { transform: scale(1.15); }
    .color-dot.active {
      border-color: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
      transform: scale(1.15);
    }
    .color-dot[data-color="#FFFFFF"] { border-color: rgba(255,255,255,0.3); }
    .color-dot[data-color="#000000"] { border-color: rgba(255,255,255,0.2); }

    /* Slider épaisseur */
    .size-control {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      flex-shrink: 0;
    }
    .size-label {
      color: #999;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      min-width: 28px;
      text-align: center;
      font-family: 'SF Mono', 'Cascadia Code', monospace;
    }
    #size-slider {
      width: 80px;
      height: 6px;
      background: linear-gradient(to right, rgba(107,91,255,0.3), rgba(107,91,255,0.8));
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    #size-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #6b5bff;
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    #size-slider::-webkit-slider-thumb:active { transform: scale(1.2); }
    #size-slider::-moz-range-thumb {
      width: 20px; height: 20px; border-radius: 50%;
      background: #6b5bff; cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* Zoom */
    .zoom-controls {
      display: flex;
      gap: 3px;
      background: rgba(255,255,255,0.04);
      padding: 3px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .zoom-btn {
      width: 34px;
      height: 34px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: #bbb;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .zoom-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .zoom-btn:active { transform: scale(0.92); }
    .zoom-text { font-size: 10px; font-weight: 600; font-family: 'SF Mono', monospace; }

    /* NAV LINK */
    .nav-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 999;
    }
    .nav-link a {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(18, 18, 24, 0.85);
      border-radius: 20px;
      font-size: 11px;
      color: #bbb;
      text-decoration: none;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      transition: all 0.2s;
      font-weight: 500;
    }
    .nav-link a:hover {
      background: rgba(107, 91, 255, 0.2);
      border-color: rgba(107, 91, 255, 0.3);
      color: #fff;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .toolbar-main { bottom: 6px; left: 6px; right: 6px; padding: 8px 10px; gap: 5px; border-radius: 14px; }
      .color-dot { width: 22px; height: 22px; }
      #size-slider { width: 60px; }
      .zoom-btn { width: 30px; height: 30px; font-size: 12px; }
    }
    @media (max-width: 480px) {
      .toolbar-main { padding: 6px 8px; gap: 4px; }
      .color-dot { width: 20px; height: 20px; }
      #size-slider { width: 50px; }
      .zoom-btn { width: 28px; height: 28px; }
      .size-control { padding: 3px 6px; gap: 4px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .toolbar-main { padding: 4px 6px; gap: 3px; border-radius: 10px; }
      .color-dot { width: 18px; height: 18px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- NAV -->
  <div class="nav-link">
    <a href="/atelier">Atelier</a>
  </div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div id="connection-indicator" class="status-indicator">
      <span style="font-size: 14px;">●</span>
      <span>Connexion...</span>
    </div>
    <div class="status-indicator">
      <span style="font-size: 12px;">📡</span>
      <span id="latency-display">--ms</span>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar-main">
    <div class="toolbar-row">
      <button id="brush" class="tool-btn active" title="Pinceau">🖋️</button>
      <button id="texture" class="tool-btn" title="Spray">🖌️</button>
      <div class="toolbar-divider"></div>
      <button id="sparkles" class="tool-btn" title="Paillettes">✨</button>
      <button id="watercolor" class="tool-btn" title="Aquarelle">💧</button>
      <button id="neon" class="tool-btn" title="Néon">🌟</button>
      <button id="fire" class="tool-btn" title="Feu">🔥</button>
      <div class="toolbar-divider"></div>
      <button id="eraser" class="tool-btn" title="Gomme">🧽</button>
      <button id="pan" class="tool-btn" title="Déplacement">✋</button>
      <button id="undo" class="tool-btn" title="Annuler (Ctrl+Z)">↶</button>
    </div>

    <div class="toolbar-controls">
      <div class="color-palette">
        <div class="color-dot active" data-color="#FFFFFF" style="background:#FFFFFF;"></div>
        <div class="color-dot" data-color="#FF5252" style="background:#FF5252;"></div>
        <div class="color-dot" data-color="#FFD740" style="background:#FFD740;"></div>
        <div class="color-dot" data-color="#40C4FF" style="background:#40C4FF;"></div>
        <div class="color-dot" data-color="#69F0AE" style="background:#69F0AE;"></div>
        <div class="color-dot" data-color="#E040FB" style="background:#E040FB;"></div>
        <div class="color-dot" data-color="#FF9800" style="background:#FF9800;"></div>
        <div class="color-dot" data-color="#000000" style="background:#000000;"></div>
      </div>

      <div class="size-control">
        <span class="size-label" id="size-value">4px</span>
        <input type="range" id="size-slider" min="1" max="20" value="4" />
      </div>

      <div class="zoom-controls">
        <button id="zoom-out" class="zoom-btn" title="Zoom -">−</button>
        <button id="zoom-reset" class="zoom-btn" title="Reset"><span class="zoom-text">100%</span></button>
        <button id="zoom-in" class="zoom-btn" title="Zoom +">+</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/konva@9.2.0/konva.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="connectionManager.js"></script>
  <script src="brushManager.js"></script>
  <script src="app.js"></script>
</body>
</html>
