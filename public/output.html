<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Output — Picturaevox 3.5</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      margin: 0;
    }

    /* ========== GRID LAYOUT ========== */
    #output-grid {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      gap: 0;
      transition: grid-template-columns 0.4s ease, grid-template-rows 0.4s ease;
    }

    /* Canvas always present */
    #canvas-cell {
      position: relative;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }
    #canvas-cell .cell-label {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      color: rgba(255,255,255,0.25);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    #canvas-container canvas, #canvas-container .konvajs-content {
      width: 100% !important;
      height: 100% !important;
    }

    /* Game cells */
    .game-cell {
      display: none;
      position: relative;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
      background: rgba(8, 8, 14, 0.95);
      border-left: 1px solid rgba(255,255,255,0.06);
    }
    .game-cell.active {
      display: flex;
      flex-direction: column;
    }

    .game-cell-header {
      flex-shrink: 0;
      padding: 16px 20px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .game-cell-title {
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .game-cell-subtitle {
      color: rgba(255,255,255,0.35);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .game-cell-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    /* ========== LAYOUT MODES ========== */

    /* 1 panel active: split 55/45 */
    #output-grid.panels-1 {
      grid-template-columns: 55fr 45fr;
    }

    /* 2 panels: canvas left, 2 panels stacked right */
    #output-grid.panels-2 {
      grid-template-columns: 50fr 50fr;
      grid-template-rows: 1fr 1fr;
    }
    #output-grid.panels-2 #canvas-cell {
      grid-row: 1 / -1;
    }

    /* 3 panels: canvas top-left, panels fill rest */
    #output-grid.panels-3 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    /* 4 panels: canvas center small, panels around */
    #output-grid.panels-4 {
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    #output-grid.panels-4 #canvas-cell {
      grid-column: 2;
      grid-row: 1 / -1;
    }

    /* ========== CADAVRE EXQUIS ========== */
    .cadavre-results {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .cadavre-team {
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      width: 100%;
      max-width: 280px;
    }
    .cadavre-team h3 {
      color: #6b5bff;
      font-size: 13px;
      margin: 0 0 10px;
      font-weight: 700;
    }
    .cadavre-team .composite-img {
      display: flex;
      flex-direction: column;
      gap: 0;
      border-radius: 6px;
      overflow: hidden;
    }
    .cadavre-team img {
      width: 100%;
      display: block;
    }
    .cadavre-team .member-list {
      margin-top: 8px;
      font-size: 10px;
      color: #666;
    }

    /* ========== TELEPHONE / GARTIC ========== */
    .telephone-chains {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chain-card {
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .chain-card h3 {
      color: #6b5bff;
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
    }
    .chain-step {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .chain-step:last-child { border-bottom: none; }
    .chain-step .step-type {
      font-size: 9px;
      color: #555;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .chain-step .step-author {
      color: #b8adff;
      font-size: 11px;
      font-weight: 600;
    }
    .chain-step .step-content {
      color: #eee;
      font-size: 14px;
      margin-top: 3px;
    }
    .chain-step img {
      max-width: 100%;
      border-radius: 6px;
      margin-top: 4px;
    }

    /* ========== DEVINE ========== */
    .devine-live {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .devine-canvas-output {
      width: 100%;
      max-width: 400px;
      border: 2px solid rgba(107, 91, 255, 0.25);
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .devine-canvas-output canvas {
      width: 100%;
      display: block;
    }
    .devine-info {
      color: #fff;
      font-size: 15px;
      text-align: center;
    }
    .devine-scores {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .devine-score-tag {
      background: rgba(107, 91, 255, 0.12);
      color: #b8adff;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 12px;
    }
    .devine-score-tag .score-val {
      font-weight: 700;
      color: #6b5bff;
    }
    .devine-correct-flash {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 700;
      color: #69F0AE;
      z-index: 100;
      animation: flashPop 1.5s ease-out forwards;
      pointer-events: none;
    }
    @keyframes flashPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
      80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
    }

    /* ========== THEME ========== */
    .theme-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .theme-item {
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .theme-item img {
      width: 100%;
      display: block;
    }
    .theme-item .artist-name {
      padding: 8px;
      color: #b8adff;
      font-size: 11px;
      text-align: center;
      font-weight: 600;
    }

    /* ========== STATUS ========== */
    .output-status {
      position: fixed;
      bottom: 10px;
      right: 10px;
      padding: 5px 12px;
      background: rgba(18, 18, 24, 0.75);
      border-radius: 16px;
      font-size: 10px;
      color: #444;
      z-index: 100;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.04);
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 900px) {
      #output-grid.panels-1 {
        grid-template-columns: 1fr;
        grid-template-rows: 50fr 50fr;
      }
      #output-grid.panels-1 .game-cell {
        border-left: none;
        border-top: 1px solid rgba(255,255,255,0.06);
      }
      #output-grid.panels-2 {
        grid-template-columns: 1fr;
        grid-template-rows: 40fr 30fr 30fr;
      }
      #output-grid.panels-2 #canvas-cell {
        grid-row: 1;
      }
      #output-grid.panels-2 .game-cell { border-left: none; border-top: 1px solid rgba(255,255,255,0.06); }
      #output-grid.panels-3,
      #output-grid.panels-4 {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(auto-fit, minmax(200px, 1fr));
      }
      #output-grid.panels-3 #canvas-cell,
      #output-grid.panels-4 #canvas-cell {
        grid-column: 1;
        grid-row: auto;
      }
    }
  </style>
</head>
<body>

  <div id="output-grid">
    <!-- Canvas cell — always present -->
    <div id="canvas-cell">
      <span class="cell-label">Toile partagee</span>
      <div id="canvas-container"></div>
    </div>

    <!-- Cadavre Exquis cell -->
    <div class="game-cell" id="cell-cadavre">
      <div class="game-cell-header">
        <div class="game-cell-title">Cadavre Exquis</div>
        <div class="game-cell-subtitle">Toile partagee</div>
      </div>
      <div class="game-cell-body">
        <div class="cadavre-results" id="cadavre-results"></div>
      </div>
    </div>

    <!-- Telephone / Gartic Phone cell -->
    <div class="game-cell" id="cell-telephone">
      <div class="game-cell-header">
        <div class="game-cell-title">Gartic Phone</div>
        <div class="game-cell-subtitle">Toile partagee</div>
      </div>
      <div class="game-cell-body">
        <div class="telephone-chains" id="telephone-results"></div>
      </div>
    </div>

    <!-- Devine cell -->
    <div class="game-cell" id="cell-devine">
      <div class="game-cell-header">
        <div class="game-cell-title" id="devine-output-title">Dessine-Devine</div>
        <div class="game-cell-subtitle">Toile partagee</div>
      </div>
      <div class="game-cell-body">
        <div class="devine-live">
          <div class="devine-info" id="devine-info"></div>
          <div class="devine-canvas-output" id="devine-canvas-output"></div>
          <div class="devine-scores" id="devine-scores-output"></div>
        </div>
      </div>
    </div>

    <!-- Theme cell -->
    <div class="game-cell" id="cell-theme">
      <div class="game-cell-header">
        <div class="game-cell-title" id="theme-output-title">Le Grand Theme</div>
        <div class="game-cell-subtitle">Toile partagee</div>
      </div>
      <div class="game-cell-body">
        <div class="theme-gallery" id="theme-results"></div>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div class="output-status" id="output-status">OUTPUT</div>

  <script src="https://cdn.jsdelivr.net/npm/konva@9.2.0/konva.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="connectionManager.js"></script>
  <script src="brushManager.js"></script>
  <script>
    // === OUTPUT PAGE - PROJECTION ===
    const socket = io({
      reconnection: true,
      reconnectionDelay: 1000,
      reconnectionAttempts: 10,
      timeout: 10000,
      transports: ['websocket', 'polling']
    });

    // === KONVA CANVAS (shared drawing — lobby) ===
    const canvasCell = document.getElementById('canvas-cell');
    const stage = new Konva.Stage({
      container: 'canvas-container',
      width: canvasCell.clientWidth,
      height: canvasCell.clientHeight
    });
    const layer = new Konva.Layer();
    stage.add(layer);

    const connectionManager = new ConnectionManager(socket);
    const brushManager = new BrushManager(layer, socket);

    // === AUTO-FIT: zoom to show all drawings ===
    let autoFitEnabled = true;
    let autoFitTimer = null;

    function getContentBounds() {
      const children = layer.getChildren();
      if (children.length === 0) return null;

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

      children.forEach(child => {
        const rect = child.getClientRect({ skipTransform: true });
        if (rect.width === 0 && rect.height === 0) return;
        minX = Math.min(minX, rect.x);
        minY = Math.min(minY, rect.y);
        maxX = Math.max(maxX, rect.x + rect.width);
        maxY = Math.max(maxY, rect.y + rect.height);
      });

      if (minX === Infinity) return null;
      return { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
    }

    function autoFitCanvas() {
      if (!autoFitEnabled) return;
      const bounds = getContentBounds();
      if (!bounds || bounds.width === 0 || bounds.height === 0) return;

      const stageW = canvasCell.clientWidth;
      const stageH = canvasCell.clientHeight;
      const padding = 40;

      const scaleX = (stageW - padding * 2) / bounds.width;
      const scaleY = (stageH - padding * 2) / bounds.height;
      const scale = Math.min(scaleX, scaleY, 2); // cap at 2x

      const offsetX = (stageW - bounds.width * scale) / 2 - bounds.x * scale;
      const offsetY = (stageH - bounds.height * scale) / 2 - bounds.y * scale;

      stage.scale({ x: scale, y: scale });
      stage.position({ x: offsetX, y: offsetY });
      stage.batchDraw();
    }

    function scheduleAutoFit() {
      if (autoFitTimer) clearTimeout(autoFitTimer);
      autoFitTimer = setTimeout(autoFitCanvas, 300);
    }

    function resizeCanvas() {
      stage.width(canvasCell.clientWidth);
      stage.height(canvasCell.clientHeight);
      autoFitCanvas();
    }

    // ResizeObserver to track cell size changes (grid transitions)
    const resizeObserver = new ResizeObserver(() => resizeCanvas());
    resizeObserver.observe(canvasCell);
    window.addEventListener('resize', resizeCanvas);

    // === GRID LAYOUT MANAGER ===
    const grid = document.getElementById('output-grid');
    const gameCells = {
      cadavre: document.getElementById('cell-cadavre'),
      telephone: document.getElementById('cell-telephone'),
      devine: document.getElementById('cell-devine'),
      theme: document.getElementById('cell-theme')
    };

    let currentLayout = {
      canvas: true,
      cadavre: false,
      telephone: false,
      devine: false,
      theme: false
    };

    function applyLayout() {
      // Count active game panels
      const modes = ['cadavre', 'telephone', 'devine', 'theme'];
      const activePanels = modes.filter(m => currentLayout[m]);
      const count = activePanels.length;

      // Toggle game cells
      modes.forEach(mode => {
        gameCells[mode].classList.toggle('active', !!currentLayout[mode]);
      });

      // Update grid class
      grid.className = '';
      if (count > 0) {
        grid.classList.add('panels-' + Math.min(count, 4));
      }

      // Canvas cell visibility (always visible but could be hidden)
      canvasCell.style.display = currentLayout.canvas ? '' : 'none';

      // Update canvas label based on state
      const label = canvasCell.querySelector('.cell-label');
      if (count === 0) {
        label.style.opacity = '1';
      } else {
        label.style.opacity = '0.5';
      }

      // Resize canvas after grid transition
      setTimeout(resizeCanvas, 50);
      setTimeout(resizeCanvas, 450);
    }

    // === SOCKET: CONNECT ===
    socket.on('connect', () => {
      socket.emit('output:join');
    });

    socket.on('output:layout', (layout) => {
      currentLayout = { ...currentLayout, ...layout };
      applyLayout();
    });

    // === CANVAS EVENTS ===
    socket.on('initShapes', (shapes) => {
      shapes.forEach(data => {
        if (data.type === 'permanentTrace') {
          let element;
          switch (data.shapeType) {
            case 'Star':    element = new Konva.Star(data.attrs); break;
            case 'Circle':  element = new Konva.Circle(data.attrs); break;
            case 'Line':    element = new Konva.Line(data.attrs); break;
            case 'Ellipse': element = new Konva.Ellipse(data.attrs); break;
          }
          if (element) {
            element.id(data.id);
            element.isPermanentTrace = true;
            layer.add(element);
          }
        } else {
          layer.add(new Konva.Line({
            id: data.id, points: data.points, stroke: data.stroke,
            strokeWidth: data.strokeWidth, globalCompositeOperation: data.globalCompositeOperation,
            lineCap: 'round', lineJoin: 'round'
          }));
        }
      });
      layer.draw();
      scheduleAutoFit();
    });

    socket.on('drawing', (data) => {
      let shape = layer.findOne('#' + data.id);
      if (shape) { shape.points(data.points); shape.strokeWidth(data.strokeWidth); }
      else {
        layer.add(new Konva.Line({
          id: data.id, points: data.points, stroke: data.stroke,
          strokeWidth: data.strokeWidth, globalCompositeOperation: data.globalCompositeOperation,
          lineCap: 'round', lineJoin: 'round'
        }));
      }
      layer.batchDraw();
      scheduleAutoFit();
    });

    socket.on('draw', (data) => {
      let shape = layer.findOne('#' + data.id);
      if (shape) {
        shape.points(data.points); shape.stroke(data.stroke);
        shape.strokeWidth(data.strokeWidth); shape.globalCompositeOperation(data.globalCompositeOperation);
      } else {
        layer.add(new Konva.Line({
          id: data.id, points: data.points, stroke: data.stroke,
          strokeWidth: data.strokeWidth, globalCompositeOperation: data.globalCompositeOperation,
          lineCap: 'round', lineJoin: 'round'
        }));
      }
      layer.draw();
      scheduleAutoFit();
    });

    socket.on('brushEffect', (data) => brushManager.createNetworkEffect(data));
    socket.on('cleanupUserEffects', (data) => brushManager.cleanupUserEffects(data.socketId));
    socket.on('texture', (data) => {
      const particleCount = 8;
      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * data.size * 1.4;
        const dotSize = 1.2 + Math.random() * (data.size / 2.5);
        const alpha = 0.35 + Math.random() * 0.35;
        if (Math.random() < 0.7) {
          const lineLength = 1 + Math.random() * 2.5;
          const lineAngle = Math.random() * Math.PI * 2;
          layer.add(new Konva.Line({
            points: [data.x + Math.cos(angle)*distance, data.y + Math.sin(angle)*distance,
                     data.x + Math.cos(angle)*distance + Math.cos(lineAngle)*lineLength,
                     data.y + Math.sin(angle)*distance + Math.sin(lineAngle)*lineLength],
            stroke: data.color, strokeWidth: dotSize * 0.8, opacity: alpha,
            lineCap: 'round', lineJoin: 'round', listening: false
          }));
        } else {
          layer.add(new Konva.Circle({
            x: data.x + Math.cos(angle)*distance, y: data.y + Math.sin(angle)*distance,
            radius: dotSize * 0.6, fill: data.color, opacity: alpha * 0.9, listening: false
          }));
        }
      }
      layer.batchDraw();
    });

    socket.on('deleteShape', ({ id }) => {
      const s = layer.findOne('#' + id);
      if (s) { s.destroy(); layer.draw(); scheduleAutoFit(); }
    });
    socket.on('clearCanvas', () => {
      layer.destroyChildren(); brushManager.clearEverything(); layer.draw();
      stage.scale({ x: 1, y: 1 });
      stage.position({ x: 0, y: 0 });
      stage.batchDraw();
    });
    socket.on('restoreShapes', (shapes) => {
      layer.destroyChildren(); brushManager.clearEverything();
      shapes.forEach(data => {
        if (data.type === 'permanentTrace') {
          let el;
          switch (data.shapeType) {
            case 'Star': el = new Konva.Star(data.attrs); break;
            case 'Circle': el = new Konva.Circle(data.attrs); break;
            case 'Line': el = new Konva.Line(data.attrs); break;
            case 'Ellipse': el = new Konva.Ellipse(data.attrs); break;
          }
          if (el) { el.id(data.id); el.isPermanentTrace = true; layer.add(el); }
        } else {
          layer.add(new Konva.Line({
            id: data.id, points: data.points, stroke: data.stroke,
            strokeWidth: data.strokeWidth, globalCompositeOperation: data.globalCompositeOperation,
            lineCap: 'round', lineJoin: 'round'
          }));
        }
      });
      layer.draw();
      scheduleAutoFit();
    });
    socket.on('adminResetBrushEffects', () => {
      brushManager.clearAllEffects(); layer.batchDraw();
    });

    // === CADAVRE EXQUIS RESULTS ===
    socket.on('game:reveal', (results) => {
      const container = document.getElementById('cadavre-results');
      container.innerHTML = '';

      results.forEach(team => {
        const div = document.createElement('div');
        div.className = 'cadavre-team';
        let html = `<h3>Equipe ${team.teamId + 1}</h3><div class="composite-img">`;
        if (team.head) html += `<img src="${team.head}" />`;
        if (team.torso) html += `<img src="${team.torso}" />`;
        if (team.legs) html += `<img src="${team.legs}" />`;
        html += `</div>`;
        html += `<div class="member-list">${team.members.map(m => m.pseudo).join(', ')}</div>`;
        div.innerHTML = html;
        container.appendChild(div);
      });

      currentLayout.cadavre = true;
      applyLayout();
    });

    // === TELEPHONE RESULTS ===
    socket.on('telephone:reveal', (chains) => {
      const container = document.getElementById('telephone-results');
      container.innerHTML = '';

      chains.forEach((chain, i) => {
        let html = `<div class="chain-card"><h3>Chaine ${i + 1}</h3>`;
        chain.forEach(step => {
          html += `<div class="chain-step">`;
          html += `<span class="step-type">${step.type === 'word' ? 'Texte' : 'Dessin'}</span> `;
          html += `<span class="step-author">${step.author || '?'}</span>`;
          if (step.type === 'drawing' && step.content) {
            html += `<br><img src="${step.content}" />`;
          } else {
            html += `<div class="step-content">${step.content || '...'}</div>`;
          }
          html += `</div>`;
        });
        html += `</div>`;
        container.innerHTML += html;
      });

      currentLayout.telephone = true;
      applyLayout();
    });

    // === DEVINE LIVE ===
    let devineOutputCanvas = null;

    socket.on('devine:roundStart', ({ drawer, round }) => {
      document.getElementById('devine-info').textContent = drawer + ' dessine... (manche ' + round + ')';

      if (devineOutputCanvas) devineOutputCanvas.destroy();
      document.getElementById('devine-canvas-output').innerHTML = '';

      const container = document.getElementById('devine-canvas-output');
      const w = Math.min(container.clientWidth || 400, 400);
      const h = Math.round(w * 0.75);
      const outputStage = new Konva.Stage({ container: 'devine-canvas-output', width: w, height: h });
      const outputLayer = new Konva.Layer();
      outputStage.add(outputLayer);
      devineOutputCanvas = { stage: outputStage, layer: outputLayer, destroy() { outputStage.destroy(); } };
    });

    socket.on('devine:drawing', (data) => {
      if (!devineOutputCanvas) return;
      const line = new Konva.Line({
        points: data.points, stroke: '#FFFFFF',
        strokeWidth: data.strokeWidth || 4,
        globalCompositeOperation: data.globalCompositeOperation || 'source-over',
        lineCap: 'round', lineJoin: 'round', listening: false
      });
      devineOutputCanvas.layer.add(line);
      devineOutputCanvas.layer.batchDraw();
    });

    socket.on('devine:correct', ({ pseudo, word }) => {
      const flash = document.createElement('div');
      flash.className = 'devine-correct-flash';
      flash.textContent = pseudo + ' a trouve : ' + word + ' !';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 2000);
    });

    socket.on('devine:scores', (scores) => {
      const container = document.getElementById('devine-scores-output');
      if (!container) return;
      const sorted = Object.values(scores).sort((a, b) => b.score - a.score);
      container.innerHTML = sorted.map(s =>
        `<span class="devine-score-tag">${s.pseudo} <span class="score-val">${s.score}</span></span>`
      ).join('');
    });

    socket.on('devine:timeUp', ({ word }) => {
      document.getElementById('devine-info').textContent = 'Temps ecoule ! Le mot etait : ' + word;
    });

    // === THEME RESULTS ===
    socket.on('theme:started', ({ theme }) => {
      document.getElementById('theme-output-title').textContent = 'Le Grand Theme : ' + theme;
    });

    socket.on('theme:reveal', ({ theme, drawings }) => {
      document.getElementById('theme-output-title').textContent = 'Le Grand Theme : ' + theme;
      const container = document.getElementById('theme-results');
      container.innerHTML = '';

      drawings.forEach(d => {
        const item = document.createElement('div');
        item.className = 'theme-item';
        item.innerHTML = `<img src="${d.imageData}" /><div class="artist-name">${d.pseudo || '?'}</div>`;
        container.appendChild(item);
      });

      currentLayout.theme = true;
      applyLayout();
    });

    // Initial layout
    applyLayout();
    console.log('[Output] Picturaevox responsive grid layout loaded');
  </script>
</body>
</html>
