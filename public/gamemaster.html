<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cadavre Exquis — Gamemaster</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: auto;
      padding: 20px;
      box-sizing: border-box;
    }

    .gm-container {
      max-width: 600px;
      width: 100%;
    }

    .gm-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .gm-header h1 {
      color: #fff;
      font-size: 26px;
      margin: 0 0 4px;
    }
    .gm-header .subtitle {
      color: #00d9ff;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .gm-card {
      background: rgba(18, 18, 24, 0.92);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 217, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #00d9ff;
      line-height: 1;
    }
    .stat-label {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .gm-status {
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .gm-status.waiting {
      background: rgba(255, 193, 7, 0.1);
      color: #FFC107;
      border: 1px solid rgba(255, 193, 7, 0.2);
    }
    .gm-status.playing {
      background: rgba(76, 175, 80, 0.1);
      color: #4CAF50;
      border: 1px solid rgba(76, 175, 80, 0.2);
    }
    .gm-status.revealing {
      background: rgba(107, 91, 255, 0.1);
      color: #8b7aff;
      border: 1px solid rgba(107, 91, 255, 0.2);
    }

    .launch-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #00d9ff, #0099cc);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .launch-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 217, 255, 0.3); }
    .launch-btn:active { transform: scale(0.97); }
    .launch-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .reset-btn {
      width: 100%;
      padding: 14px;
      background: rgba(255,255,255,0.06);
      color: #ccc;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .reset-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .timer-section {
      display: none;
      text-align: center;
      margin-bottom: 16px;
    }
    .timer-section.visible { display: block; }
    .gm-timer {
      font-size: 48px;
      font-weight: 700;
      color: #00d9ff;
      font-family: 'SF Mono', 'Cascadia Code', monospace;
    }
    .gm-timer.urgent { color: #FF5252; }
    .timer-label {
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .teams-section {
      display: none;
    }
    .teams-section.visible { display: block; }
    .teams-section h3 {
      color: #fff;
      font-size: 16px;
      margin: 0 0 12px;
    }
    .team-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .team-label {
      color: #00d9ff;
      font-weight: 700;
      font-size: 13px;
      min-width: 60px;
    }
    .team-members {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .member-tag {
      padding: 3px 10px;
      border-radius: 16px;
      font-size: 12px;
    }
    .member-tag.head { background: rgba(255, 82, 82, 0.15); color: #FF8A80; }
    .member-tag.torso { background: rgba(64, 196, 255, 0.15); color: #80D8FF; }
    .member-tag.legs { background: rgba(105, 240, 174, 0.15); color: #B9F6CA; }

    .player-list-gm {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .player-tag-gm {
      background: rgba(0, 217, 255, 0.1);
      color: #80d8ff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .link-section {
      text-align: center;
      margin-top: 12px;
    }
    .link-section a {
      color: #00d9ff;
      text-decoration: none;
      font-size: 13px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .link-section a:hover { opacity: 1; }

    @media (max-width: 480px) {
      .gm-header h1 { font-size: 22px; }
      .stat-value { font-size: 28px; }
      .gm-timer { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="gm-container">
    <div class="gm-header">
      <h1>Cadavre Exquis</h1>
      <div class="subtitle">Gamemaster</div>
    </div>

    <div class="gm-card">
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" id="player-count-gm">0</div>
          <div class="stat-label">Joueurs</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="team-count-gm">0</div>
          <div class="stat-label">&Eacute;quipes</div>
        </div>
      </div>

      <div class="gm-status waiting" id="game-status">En attente de joueurs...</div>

      <div class="timer-section" id="timer-section">
        <div class="gm-timer" id="gm-timer">30</div>
        <div class="timer-label">secondes restantes</div>
      </div>

      <button class="launch-btn" id="launch-btn" disabled>Lancer la partie</button>
      <button class="reset-btn" id="reset-btn" style="display:none;">Nouvelle partie</button>

      <div class="player-list-gm" id="player-list-gm"></div>
    </div>

    <div class="gm-card teams-section" id="teams-section">
      <h3>&Eacute;quipes</h3>
      <div id="teams-list"></div>
    </div>

    <div class="link-section">
      <a href="/exquiscadavre" target="_blank">Ouvrir la page de r&eacute;v&eacute;lation &rarr;</a>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="gamemaster.js"></script>
</body>
</html>
